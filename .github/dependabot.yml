version: 2
updates:
  # Every action is pinned to a commit SHA (with a version comment) in the
  # workflows; Dependabot keeps those pins current and opens a reviewable PR for
  # each update. It understands the "# vX.Y.Z" comment that follows the SHA.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci