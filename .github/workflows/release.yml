name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # Push and restore the vcpkg binary cache on GitHub Packages. The Actions
  # cache (10 GB/repo, evicted after 7 idle days) cannot durably hold a cold
  # OpenUSD + OCCT closure; the Packages NuGet feed can.
  packages: write
  # actions/attest-build-provenance mints an OIDC token and writes build
  # provenance to the repository's attestations store.
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fail closed: the package job cannot start until the reusable test gate
  # (Debug and Release builds plus the unit, import-isolation, and provider-host
  # suites) has passed on this tag. A red test therefore stops the release
  # before any signed artifact is produced. See .github/workflows/ci.yml.
  gate:
    name: Test gate
    uses: ./.github/workflows/ci.yml

  release:
    name: Build, package, and release
    needs: gate
    runs-on: windows-2025
    # A required-reviewer environment gates the whole job before it starts: the
    # tag push alone cannot publish. The maintainer configures the `release`
    # environment's protection rules (required reviewers, deployment branches =
    # tags). Signing and attestation happen only after that approval.
    environment: release
    # The root manifest (OpenUSD) and the isolated STEP manifest (OCCT) both
    # build from source on a cold runner; the binary cache below keeps repeat
    # releases fast, but the first cold build needs more than the old 90 min.
    timeout-minutes: 360

    env:
      # Persist vcpkg's compiled package archives across runs so a release does
      # not rebuild OpenUSD/OCCT from source every time.
      #
      # The durable cache is a NuGet feed on GitHub Packages, which has no
      # 10 GB per-repo cap and no 7-day idle eviction. The Actions files cache
      # is kept as a fast, same-run secondary source; it is best-effort only.
      # VCPKG_BINARY_SOURCES is published by the "Add NuGet binary-cache source"
      # step so a Packages outage degrades to the files cache rather than
      # failing the release.
      #
      # This cache (and, in the restore step, every vcpkg scratch tree) lives on
      # the workspace volume, not the runner image's C: drive. By default vcpkg
      # puts `buildtrees`, `packages`, and `downloads` under
      # VCPKG_INSTALLATION_ROOT (C:\vcpkg); OpenUSD's and, especially, OCCT's
      # object files filled C: and OCCT died with C1085 "No space left on
      # device". The workspace volume is the one that already has to hold the
      # multi-GB vcpkg_installed trees.
      VCPKG_FEED_OWNER: ${{ github.repository_owner }}
      VCPKG_FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-binary-cache
      VCPKG_SCRATCH: ${{ github.workspace }}\..\.vcpkg-scratch

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Report disk layout
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_.Used) -and ($_.Used + $_.Free) -gt 0 } |
            ForEach-Object {
              '{0}: {1:N1} GB free of {2:N1} GB' -f $_.Name, ($_.Free / 1GB), (($_.Used + $_.Free) / 1GB)
            }

      - name: Restore vcpkg binary cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        # Best-effort: the durable cache is the GitHub Packages NuGet feed. If
        # this directory exceeds the 10 GB per-repo cache limit, the save must
        # not fail an otherwise successful release.
        continue-on-error: true
        with:
          path: ${{ github.workspace }}/.vcpkg-binary-cache
          key: vcpkg-binary-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'compatibility-host-step/vcpkg.json', 'compatibility-host-step/vcpkg-configuration.json', 'thumbnail-provider/step-occt/vcpkg.json', 'thumbnail-provider/step-occt/vcpkg-configuration.json', 'packaging/vcpkg-ports/**', 'packaging/triplets/**') }}
          restore-keys: |
            vcpkg-binary-${{ runner.os }}-

      - name: Validate release tag
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $pattern = '^v(?<version>(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?)$'
          if ($env:RELEASE_TAG -notmatch $pattern) {
            throw "Release tags must use vMAJOR.MINOR.PATCH SemVer syntax; received '$env:RELEASE_TAG'."
          }

          $version = $Matches.version
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Locate build tools
        id: tools
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $visualStudio = (& $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -property installationPath).Trim()
          if ([string]::IsNullOrWhiteSpace($visualStudio)) {
            throw 'Visual Studio with MSBuild was not found on the runner.'
          }

          $msbuild = Join-Path $visualStudio 'MSBuild\Current\Bin\MSBuild.exe'
          if (-not (Test-Path -LiteralPath $msbuild -PathType Leaf)) {
            throw "MSBuild was not found at '$msbuild'."
          }

          $vcpkgRoots = @(
            $env:VCPKG_INSTALLATION_ROOT,
            (Join-Path $visualStudio 'VC\vcpkg')
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          $vcpkgRoot = $vcpkgRoots |
            Where-Object { Test-Path -LiteralPath (Join-Path $_ 'vcpkg.exe') -PathType Leaf } |
            Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) {
            throw 'vcpkg.exe was not found on the runner.'
          }
          $vcpkgRoot = [IO.Path]::GetFullPath($vcpkgRoot).TrimEnd('\')
          $vcpkg = Join-Path $vcpkgRoot 'vcpkg.exe'

          # NSIS 3.12 is pinned by SHA-256. Prefer the vendored copy under
          # packaging\vendor so a release never depends on a third-party mirror
          # at tag time; only if it is absent do we fall back to downloading,
          # which is what makes this robust against SourceForge's frontend
          # (downloads.sourceforge.net) intermittently returning HTTP 522.
          # Every candidate is accepted only if it hashes to the pinned value,
          # which is what makes the non-sourceforge fallback host safe.
          $nsisVersion = '3.12'
          $nsisSha256 = '56581f90db321581c5381193d796fffcf2d24b2f8fed2160a6c6a3baa67f2c4f'
          $nsisArchive = Join-Path $env:RUNNER_TEMP "nsis-$nsisVersion.zip"
          $nsisDirectory = Join-Path $env:RUNNER_TEMP 'nsis'
          $vendoredNsis = Join-Path $env:GITHUB_WORKSPACE "packaging\vendor\nsis-$nsisVersion.zip"
          $nsisSources = @(
            "https://downloads.sourceforge.net/project/nsis/NSIS%203/$nsisVersion/nsis-$nsisVersion.zip?download",
            "https://fossies.org/windows/misc/nsis-$nsisVersion.zip"
          )

          Remove-Item -LiteralPath $nsisArchive -Force -ErrorAction SilentlyContinue
          if (Test-Path -LiteralPath $vendoredNsis -PathType Leaf) {
            Write-Host "Using vendored NSIS archive at $vendoredNsis"
            Copy-Item -LiteralPath $vendoredNsis -Destination $nsisArchive -Force
          } else {
            foreach ($nsisSource in $nsisSources) {
              Write-Host "Downloading NSIS $nsisVersion from $nsisSource"
              Remove-Item -LiteralPath $nsisArchive -Force -ErrorAction SilentlyContinue
              curl.exe --fail --location --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors `
                --output $nsisArchive $nsisSource
              if ($LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath $nsisArchive -PathType Leaf)) {
                break
              }
              Write-Warning "NSIS source '$nsisSource' failed with exit code ${LASTEXITCODE}."
            }
          }
          if (-not (Test-Path -LiteralPath $nsisArchive -PathType Leaf)) {
            throw "NSIS $nsisVersion could not be obtained from the vendored archive or any download source."
          }

          $downloadedSha256 = (Get-FileHash -LiteralPath $nsisArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($downloadedSha256 -ne $nsisSha256) {
            throw "NSIS archive checksum mismatch. Expected $nsisSha256; received $downloadedSha256."
          }

          Expand-Archive -LiteralPath $nsisArchive -DestinationPath $nsisDirectory -Force
          $nsis = Join-Path $nsisDirectory "nsis-$nsisVersion\makensis.exe"
          if (-not (Test-Path -LiteralPath $nsis -PathType Leaf)) {
            throw "makensis.exe was not found after extracting NSIS to '$nsisDirectory'."
          }
          $detectedNsisVersion = (& $nsis /VERSION).Trim()
          if ($LASTEXITCODE -ne 0 -or $detectedNsisVersion -ne "v$nsisVersion") {
            throw "Expected NSIS v$nsisVersion, but makensis reported '$detectedNsisVersion'."
          }

          # Authenticode signer for the binary payload (through the packaging
          # scripts) and for the detached PKCS#7 signatures of the checksum
          # files. Mirror the packaging scripts' own discovery order.
          $signTool = Get-ChildItem -LiteralPath (Join-Path $visualStudio 'Common7\Tools') -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if ([string]::IsNullOrWhiteSpace($signTool)) {
            $windowsKits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
            $signTool = Get-ChildItem -LiteralPath $windowsKits -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if ([string]::IsNullOrWhiteSpace($signTool)) {
            throw 'A signing certificate is required for a tag release, but signtool.exe was not found.'
          }

          "msbuild=$msbuild" >> $env:GITHUB_OUTPUT
          "nsis=$nsis" >> $env:GITHUB_OUTPUT
          "vcpkg=$vcpkg" >> $env:GITHUB_OUTPUT
          "vcpkg_root=$vcpkgRoot" >> $env:GITHUB_OUTPUT
          "signtool=$signTool" >> $env:GITHUB_OUTPUT

      - name: Add NuGet binary-cache source
        shell: pwsh
        env:
          VCPKG_EXE: ${{ steps.tools.outputs.vcpkg }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Register the GitHub Packages NuGet feed through a throwaway
          # NuGet.Config under RUNNER_TEMP and vcpkg's `nugetconfig` source (the
          # only provider that takes `-Config`). The token is never written to the
          # user-profile NuGet.Config, and the always() cleanup step removes it.
          #
          # The binary source is published to later steps through GITHUB_ENV
          # rather than set up front, so a NuGet or GitHub Packages outage
          # degrades to the local files cache instead of failing the release.
          $filesSource = "files,$env:VCPKG_DEFAULT_BINARY_CACHE,readwrite"
          $configPath = Join-Path $env:RUNNER_TEMP 'preview3d-nuget.config'
          try {
            $nuget = (& $env:VCPKG_EXE fetch nuget |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
              Select-Object -Last 1).Trim()
            if ([string]::IsNullOrWhiteSpace($nuget) -or -not (Test-Path -LiteralPath $nuget -PathType Leaf)) {
              throw "vcpkg did not provide a usable nuget.exe (got '$nuget')."
            }

            $configLines = @(
              '<?xml version="1.0" encoding="utf-8"?>',
              '<configuration>',
              '  <packageSources>',
              '    <clear />',
              '  </packageSources>',
              '  <config>',
              "    <add key=`"defaultPushSource`" value=`"$env:VCPKG_FEED_URL`" />",
              '  </config>',
              '</configuration>'
            )
            Set-Content -LiteralPath $configPath -Value $configLines -Encoding UTF8

            & $nuget sources add `
              -Source $env:VCPKG_FEED_URL `
              -StorePasswordInClearText `
              -Name GitHubPackages `
              -UserName $env:VCPKG_FEED_OWNER `
              -Password $env:GITHUB_TOKEN `
              -ConfigFile $configPath
            if ($LASTEXITCODE -ne 0) {
              throw "nuget sources add failed with exit code $LASTEXITCODE."
            }

            & $nuget setapikey $env:GITHUB_TOKEN -Source $env:VCPKG_FEED_URL -ConfigFile $configPath
            if ($LASTEXITCODE -ne 0) {
              throw "nuget setapikey failed with exit code $LASTEXITCODE."
            }

            "VCPKG_BINARY_SOURCES=clear;nugetconfig,$configPath,readwrite;$filesSource" >> $env:GITHUB_ENV
            Write-Host 'vcpkg binary cache: ephemeral GitHub Packages config plus local files cache.'
          } catch {
            Write-Warning "GitHub Packages binary cache unavailable; using the local files cache only. $_"
            "VCPKG_BINARY_SOURCES=clear;$filesSource" >> $env:GITHUB_ENV
          }

      - name: Restore vcpkg dependencies
        shell: pwsh
        env:
          VCPKG_EXE: ${{ steps.tools.outputs.vcpkg }}
          VCPKG_ROOT: ${{ steps.tools.outputs.vcpkg_root }}
        run: |
          function Show-Disk([string] $label) {
            Write-Host "--- disk after $label ---"
            Get-PSDrive -PSProvider FileSystem |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_.Used) -and ($_.Used + $_.Free) -gt 0 } |
              ForEach-Object {
                Write-Host ('  {0}: {1:N1} GB free of {2:N1} GB' -f $_.Name, ($_.Free / 1GB), (($_.Used + $_.Free) / 1GB))
              }
          }

          # actions/cache only materializes the directory on a cache hit, so a
          # cold run leaves it missing and vcpkg rejects the binary cache path.
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

          # Route every scratch tree off the runner image's C: drive. vcpkg's
          # default is <VCPKG_ROOT>\{buildtrees,packages,downloads}, i.e. C:,
          # which is what filled up. The workspace volume also holds the
          # installed trees, so it is the volume with room.
          $buildtreesRoot = Join-Path $env:VCPKG_SCRATCH 'buildtrees'
          $packagesRoot = Join-Path $env:VCPKG_SCRATCH 'packages'
          $downloadsRoot = Join-Path $env:VCPKG_SCRATCH 'downloads'
          foreach ($path in @($buildtreesRoot, $packagesRoot, $downloadsRoot)) {
            New-Item -ItemType Directory -Force -Path $path | Out-Null
          }

          # Shared flags for both manifests.
          #
          # --overlay-triplets shadows x64-windows-static-md with
          # packaging\triplets\x64-windows-static-md.cmake, which sets
          # VCPKG_BUILD_TYPE=release. Nothing here consumes vcpkg's debug half,
          # so building it only doubles compile time and disk. The static
          # linkage is what removes the upstream DLLs from the payload; see
          # Directory.Build.props.
          #
          # --clean-*-after-build bounds peak scratch usage to roughly the
          # largest single package (OCCT). The compiled archives are already in
          # the binary cache by then, so pruning costs nothing on a re-run.
          $common = @(
            '--triplet', 'x64-windows-static-md',
            "--overlay-triplets=$env:GITHUB_WORKSPACE\packaging\triplets",
            "--vcpkg-root=$env:VCPKG_ROOT",
            "--x-buildtrees-root=$buildtreesRoot",
            "--x-packages-root=$packagesRoot",
            "--downloads-root=$downloadsRoot",
            '--clean-buildtrees-after-build',
            '--clean-packages-after-build',
            '--x-wait-for-lock'
          )

          & $env:VCPKG_EXE integrate install
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg MSBuild integration failed with exit code $LASTEXITCODE."
          }

          # Root manifest: the viewer/worker and the OpenUSD compatibility host.
          # The default project layout resolves to
          # vcpkg_installed\x64-windows-static-md\x64-windows-static-md, matching
          # VcpkgInstalledDir and the packaging script.
          $installRoot = Join-Path $env:GITHUB_WORKSPACE 'vcpkg_installed\x64-windows-static-md'
          & $env:VCPKG_EXE install @common `
            "--x-manifest-root=$env:GITHUB_WORKSPACE" `
            "--x-install-root=$installRoot"
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg root-manifest restore failed with exit code $LASTEXITCODE."
          }
          Show-Disk 'root manifest'

          # Isolated STEP manifest: OCCT only. Preview3DStepHost sets
          # VcpkgInstalledDir=compatibility-host-step\vcpkg_installed, so its
          # triplet tree must land directly under that directory (single
          # x64-windows-static-md segment), which is also where the packaging
          # script reads the OCCT license and SPDX record from.
          $stepManifestRoot = Join-Path $env:GITHUB_WORKSPACE 'compatibility-host-step'
          $stepInstallRoot = Join-Path $stepManifestRoot 'vcpkg_installed'
          & $env:VCPKG_EXE install @common `
            "--x-manifest-root=$stepManifestRoot" `
            "--x-install-root=$stepInstallRoot"
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg STEP-manifest restore failed with exit code $LASTEXITCODE."
          }
          Show-Disk 'STEP manifest'

          # Isolated thumbnail-provider STEP manifest: OCCT only, in its own
          # tree so neither the viewer/worker nor either import host can link
          # it (ADR-0002). Preview3DThumbnailProvider.vcxproj hard-codes
          # thumbnail-provider\step-occt\vcpkg_installed\<triplet>, and
          # CreateInstaller builds that project, so a cold release runner must
          # restore this tree or the STEP adapter cannot find BRepBndLib.hxx.
          $providerManifestRoot = Join-Path $env:GITHUB_WORKSPACE 'thumbnail-provider\step-occt'
          $providerInstallRoot = Join-Path $providerManifestRoot 'vcpkg_installed'
          & $env:VCPKG_EXE install @common `
            "--x-manifest-root=$providerManifestRoot" `
            "--x-install-root=$providerInstallRoot"
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg thumbnail-provider STEP-manifest restore failed with exit code $LASTEXITCODE."
          }
          Show-Disk 'thumbnail-provider STEP manifest'

      - name: Import signing certificate
        id: signing
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:CERTIFICATE_PASSWORD)
          if ($hasCertificate -ne $hasPassword) {
            throw 'Configure both WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD, or neither.'
          }
          if (-not $hasCertificate) {
            # Fail closed. This workflow only runs for a v* tag, so there is no
            # unsigned release path here: what would be published would be
            # unsigned and unattested. An unsigned engineering build is still
            # available locally from the packaging scripts
            # (packaging/portable/Create-PortableRelease.ps1 and
            # packaging/installer/Create-Installer.ps1, which warn and continue
            # when no thumbprint is passed); it must never be published by CI.
            throw 'Refusing to publish an unsigned release: set WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD in the release environment.'
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP 'preview3d-release.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password |
            Where-Object HasPrivateKey |
            Select-Object -First 1
          if ($null -eq $certificate) {
            throw 'The PFX did not contain a certificate with a private key.'
          }
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Create portable package
        shell: pwsh
        env:
          MSBUILD_PATH: ${{ steps.tools.outputs.msbuild }}
          VCPKG_ROOT: ${{ steps.tools.outputs.vcpkg_root }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          SIGNING_THUMBPRINT: ${{ steps.signing.outputs.thumbprint }}
        run: |
          $arguments = @(
            'Preview3D.slnx',
            '/t:CreatePortableRelease',
            '/p:Configuration=Release',
            '/p:Platform=x64',
            "/p:ReleaseVersion=$env:RELEASE_VERSION",
            "/p:VcpkgRoot=$env:VCPKG_ROOT",
            '/p:VcpkgManifestInstall=false',
            '/m:1',
            '/v:minimal'
          )
          if (-not [string]::IsNullOrWhiteSpace($env:SIGNING_THUMBPRINT)) {
            $arguments += "/p:PortableSigningThumbprint=$env:SIGNING_THUMBPRINT"
          }
          & $env:MSBUILD_PATH @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Portable packaging failed with exit code $LASTEXITCODE."
          }

      - name: Create installer
        shell: pwsh
        env:
          MSBUILD_PATH: ${{ steps.tools.outputs.msbuild }}
          NSIS_PATH: ${{ steps.tools.outputs.nsis }}
          VCPKG_ROOT: ${{ steps.tools.outputs.vcpkg_root }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          SIGNING_THUMBPRINT: ${{ steps.signing.outputs.thumbprint }}
        run: |
          $arguments = @(
            'Preview3D.slnx',
            '/t:CreateInstaller',
            '/p:Configuration=Release',
            '/p:Platform=x64',
            "/p:ReleaseVersion=$env:RELEASE_VERSION",
            "/p:NsisPath=$env:NSIS_PATH",
            "/p:VcpkgRoot=$env:VCPKG_ROOT",
            '/p:VcpkgManifestInstall=false',
            '/m:1',
            '/v:minimal'
          )
          if (-not [string]::IsNullOrWhiteSpace($env:SIGNING_THUMBPRINT)) {
            $arguments += "/p:InstallerSigningThumbprint=$env:SIGNING_THUMBPRINT"
          }
          & $env:MSBUILD_PATH @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Installer packaging failed with exit code $LASTEXITCODE."
          }

      - name: Collect SBOM, manifest, and checksums
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          function Get-Sha256([string]$Path) {
            return (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant()
          }

          $version = $env:RELEASE_VERSION
          $meta = Join-Path $env:GITHUB_WORKSPACE 'artifacts\release'
          New-Item -ItemType Directory -Force -Path $meta | Out-Null

          # The SBOM and MANIFEST already ship inside each archive; publishing
          # renamed copies as release assets makes them independently
          # downloadable and independently attestable. Both distributions emit a
          # file literally named SBOM.cdx.json / MANIFEST.json, so disambiguate.
          $metadata = @(
            @{ Source = 'artifacts/portable/stage/SBOM.cdx.json'; Destination = "Preview3D-$version-portable-x64.sbom.cdx.json" },
            @{ Source = 'artifacts/portable/stage/MANIFEST.json'; Destination = "Preview3D-$version-portable-x64.manifest.json" },
            @{ Source = 'artifacts/installer/stage/SBOM.cdx.json'; Destination = "Preview3D-$version-x64-setup.sbom.cdx.json" },
            @{ Source = 'artifacts/installer/stage/MANIFEST.json'; Destination = "Preview3D-$version-x64-setup.manifest.json" }
          )
          foreach ($entry in $metadata) {
            if (-not (Test-Path -LiteralPath $entry.Source -PathType Leaf)) {
              throw "Expected release metadata is missing: $($entry.Source)"
            }
            Copy-Item -LiteralPath $entry.Source -Destination (Join-Path $meta $entry.Destination) -Force
          }

          foreach ($checksum in @(
            "artifacts/portable/Preview3D-$version-portable-x64.zip.sha256",
            "artifacts/installer/Preview3D-$version-x64-setup.exe.sha256"
          )) {
            if (-not (Test-Path -LiteralPath $checksum -PathType Leaf)) {
              throw "Expected checksum is missing: $checksum"
            }
            Copy-Item -LiteralPath $checksum -Destination (Join-Path $meta ([IO.Path]::GetFileName($checksum))) -Force
          }

          # One combined manifest-of-checksums over the published binaries and
          # their metadata. This is the aggregation the certificate signs.
          $sums = Join-Path $meta "Preview3D-$version-SHA256SUMS"
          $entries = @(
            "artifacts/portable/Preview3D-$version-portable-x64.zip",
            "artifacts/installer/Preview3D-$version-x64-setup.exe"
          ) + @(Get-ChildItem -LiteralPath $meta -File -Filter 'Preview3D-*' |
            Where-Object { $_.Name -notlike '*-SHA256SUMS' } |
            ForEach-Object { $_.FullName })
          $lines = foreach ($file in $entries) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Cannot checksum a missing file: $file"
            }
            '{0}  {1}' -f (Get-Sha256 $file), [IO.Path]::GetFileName($file)
          }
          Set-Content -LiteralPath $sums -Value $lines -Encoding ASCII

      - name: Sign release metadata
        shell: pwsh
        env:
          SIGNTOOL_PATH: ${{ steps.tools.outputs.signtool }}
          SIGNING_THUMBPRINT: ${{ steps.signing.outputs.thumbprint }}
          TIMESTAMP_URL: https://timestamp.digicert.com
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_THUMBPRINT)) {
            throw 'The signing certificate was not imported; refusing to publish unsigned metadata.'
          }

          $meta = Join-Path $env:GITHUB_WORKSPACE 'artifacts\release'
          # Authenticode embeds signatures only in PE/CAB/MSI/script files, so a
          # text checksum file gets a detached PKCS#7 (SPC indirect data)
          # signature instead: `signtool verify /p7 <file>.p7` validates it. The
          # `.p7` sidecars are published alongside the files they cover.
          $p7Directory = Join-Path $env:RUNNER_TEMP 'preview3d-p7'
          if (Test-Path -LiteralPath $p7Directory) {
            Remove-Item -LiteralPath $p7Directory -Recurse -Force
          }
          New-Item -ItemType Directory -Path $p7Directory -Force | Out-Null

          $signables = @(Get-ChildItem -LiteralPath $meta -File |
            Where-Object { $_.Name -like '*.sha256' -or $_.Name -like '*-SHA256SUMS' })
          if ($signables.Count -eq 0) {
            throw 'No checksum files were found to sign.'
          }

          & $env:SIGNTOOL_PATH sign /sha1 $env:SIGNING_THUMBPRINT /fd SHA256 `
            /tr $env:TIMESTAMP_URL /td SHA256 `
            /p7 $p7Directory /p7co 1.3.6.1.4.1.311.2.1.4 `
            @($signables | ForEach-Object { $_.FullName })
          if ($LASTEXITCODE -ne 0) {
            throw "Signing the release checksums failed with exit code $LASTEXITCODE."
          }

          foreach ($signature in @(Get-ChildItem -LiteralPath $p7Directory -Filter '*.p7' -File)) {
            & $env:SIGNTOOL_PATH verify /p7 $signature.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "PKCS#7 verification failed for '$($signature.Name)'."
            }
            Copy-Item -LiteralPath $signature.FullName -Destination (Join-Path $meta $signature.Name) -Force
          }

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        env:
          SIGNING_THUMBPRINT: ${{ steps.signing.outputs.thumbprint }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:SIGNING_THUMBPRINT)) {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:SIGNING_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          }
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'preview3d-release.pfx') -Force -ErrorAction SilentlyContinue

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            artifacts/portable/Preview3D-${{ steps.version.outputs.version }}-portable-x64.zip
            artifacts/installer/Preview3D-${{ steps.version.outputs.version }}-x64-setup.exe
            artifacts/release/Preview3D-${{ steps.version.outputs.version }}-portable-x64.sbom.cdx.json
            artifacts/release/Preview3D-${{ steps.version.outputs.version }}-portable-x64.manifest.json
            artifacts/release/Preview3D-${{ steps.version.outputs.version }}-x64-setup.sbom.cdx.json
            artifacts/release/Preview3D-${{ steps.version.outputs.version }}-x64-setup.manifest.json
            artifacts/release/Preview3D-${{ steps.version.outputs.version }}-SHA256SUMS

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          IS_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          $assets = @(
            "artifacts/portable/Preview3D-$env:RELEASE_VERSION-portable-x64.zip",
            "artifacts/portable/Preview3D-$env:RELEASE_VERSION-portable-x64.zip.sha256",
            "artifacts/installer/Preview3D-$env:RELEASE_VERSION-x64-setup.exe",
            "artifacts/installer/Preview3D-$env:RELEASE_VERSION-x64-setup.exe.sha256"
          ) + @(Get-ChildItem -LiteralPath 'artifacts\release' -File | ForEach-Object { $_.FullName })
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Expected release artifact is missing: $asset"
            }
          }

          # Never overwrite a published release: the workflow is gated by the
          # `release` environment's required reviewers, and a re-run of a
          # published tag is refused rather than `--clobber`ed. A leftover draft
          # (a previous failed attempt) is deleted and recreated so no
          # `--clobber` is needed, then the draft is published at the end.
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft *> $null
          if ($LASTEXITCODE -eq 0) {
            $existing = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft | ConvertFrom-Json
            if (-not $existing.isDraft) {
              throw "Release '$env:RELEASE_TAG' is already published; refusing to overwrite it. Delete it deliberately to re-release."
            }
            gh release delete $env:RELEASE_TAG --yes --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) {
              throw "Could not remove the stale draft release '$env:RELEASE_TAG'."
            }
          }

          $arguments = @(
            'release', 'create', $env:RELEASE_TAG,
            '--draft',
            '--verify-tag',
            '--generate-notes',
            '--title', "Preview 3D $env:RELEASE_VERSION",
            '--repo', $env:GITHUB_REPOSITORY
          )
          if ($env:IS_PRERELEASE -eq 'true') {
            $arguments += '--prerelease'
          }
          $arguments += $assets
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Creating the draft GitHub release failed with exit code $LASTEXITCODE."
          }

          gh release edit $env:RELEASE_TAG --draft=false --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            throw "Publishing the draft GitHub release failed with exit code $LASTEXITCODE."
          }

      # Final step: the ephemeral Packages config is needed through the restore
      # (moving this cleanup after "Restore vcpkg dependencies" is what makes the
      # durable feed usable at all — it used to be deleted first). `always()`
      # removes it even when an earlier step failed. A tag release runs only
      # trusted code, so the token is never exposed to PR-authored portfiles.
      - name: Remove ephemeral NuGet credentials
        if: always()
        shell: pwsh
        run: |
          $configPath = Join-Path $env:RUNNER_TEMP 'preview3d-nuget.config'
          if (Test-Path -LiteralPath $configPath -PathType Leaf) {
            Remove-Item -LiteralPath $configPath -Force
          }
