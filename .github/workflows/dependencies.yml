name: Dependencies

# Restores the pinned vcpkg manifests on the same runner image the release
# workflow uses, without packaging anything. This is the early-warning lane for
# the failure mode that only surfaced when a release tag was pushed: a cold
# OpenUSD + OCCT build does not fit on the runner's C: drive and takes hours.
#
# It is intentionally narrow. It runs when a dependency lock/manifest, an
# overlay port, the release-only CI triplet, or this workflow changes, and it
# can be dispatched by hand to exercise the cold path on demand.
#
# The binary-cache key matches release.yml so a successful run here warms the
# cache a later tagged release restores.
#
# Permissions are split by event (SEC-14). A pull_request runs the shared
# dependencies-restore.yml with `packages: read` and `feed-access: read`, so
# PR-authored portfiles can restore warm packages but cannot push to the GitHub
# Packages feed that release.yml later restores. Trusted events
# (push/schedule/workflow_dispatch) run the same restore with `packages: write`
# and `feed-access: readwrite` to warm it.

on:
  workflow_dispatch:
  schedule:
    # Weekly warm-up. Keeps the Actions files cache from going 7 idle days
    # without access (which evicts it) and catches upstream port drift between
    # releases instead of at tag time.
    - cron: '23 5 * * 1'
  push:
    branches:
      - main
    paths:
      - 'vcpkg.json'
      - 'vcpkg-configuration.json'
      - 'compatibility-host-step/vcpkg.json'
      - 'compatibility-host-step/vcpkg-configuration.json'
      - 'thumbnail-provider/step-occt/vcpkg.json'
      - 'thumbnail-provider/step-occt/vcpkg-configuration.json'
      - 'packaging/vcpkg-ports/**'
      - 'packaging/triplets/**'
      - '.github/workflows/dependencies.yml'
      - '.github/workflows/dependencies-restore.yml'
  pull_request:
    paths:
      - 'vcpkg.json'
      - 'vcpkg-configuration.json'
      - 'compatibility-host-step/vcpkg.json'
      - 'compatibility-host-step/vcpkg-configuration.json'
      - 'thumbnail-provider/step-occt/vcpkg.json'
      - 'thumbnail-provider/step-occt/vcpkg-configuration.json'
      - 'packaging/vcpkg-ports/**'
      - 'packaging/triplets/**'
      - '.github/workflows/dependencies.yml'
      - '.github/workflows/dependencies-restore.yml'

permissions:
  contents: read
  # Safe default: a same-repo pull_request gets a read-only packages token so it
  # cannot write the release binary-cache feed. The trusted `warm` job below
  # elevates to `packages: write` for push/schedule/workflow_dispatch.
  packages: read

concurrency:
  group: dependencies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restore-pr:
    name: Restore vcpkg manifests (pull request, read-only)
    # Same-repo PRs get more than a fork's read-only token, so this job pins the
    # permission and the feed mode rather than relying on the fork downgrade.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/dependencies-restore.yml
    with:
      feed-access: read
      # Untrusted: never create the token-bearing NuGet config. `vcpkg install`
      # runs PR-authored overlay portfiles, which could read it.
      configure-feed: false
    secrets: inherit

  warm:
    name: Restore vcpkg manifests (warm binary cache)
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/dependencies-restore.yml
    with:
      feed-access: readwrite
      configure-feed: true
    secrets: inherit